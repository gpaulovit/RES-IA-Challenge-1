<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RES-IA-Challenge-1</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Estimativa da chance de uma notícia política ser falsa a partir de boatos já checados (RES-IA-Challenge-1)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'RES-IA-Challenge-1',
      repo: 'gpaulovit/RES-IA-Challenge-1',
      loadSidebar: true,
      requestHeaders: {
        'Cache-Control': 'no-cache'
      },
      subMaxLevel: 2,
      auto2top: true,
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              var texto = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
              return '<div class="mermaid">' + texto + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [function (hook) {
        hook.doneEach(function () { mermaid.run({ querySelector: '.mermaid' }); });
      }]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false });</script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
