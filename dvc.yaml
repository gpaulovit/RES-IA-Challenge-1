# Pipeline completo: bases de dados (docs/dados.md) + duas camadas (RF-14).
# Comando único: `dvc repro` (ou um estágio: `dvc repro treinar`).
# Rode com o ambiente ativado (source .venv/bin/activate) e o pacote instalado (pip install -e '.[busca]').
# Resultados pequenos (CSV/JSON) ficam no git (cache: false); dados brutos, modelo e índice ficam no cache do DVC.
stages:
  baixar:
    cmd: python -m checagens.bases.baixar
    deps:
      - src/checagens/bases/baixar.py
      - src/checagens/bases/fontes.py
    outs:
      - data/brutos:
          persist: true

  checagens:
    cmd: python -m checagens.bases.checagens
    deps:
      - src/checagens/bases/checagens.py
      - src/checagens/bases/texto.py
      - src/checagens/bases/vereditos.py
      - data/brutos/factpolcheckbr
      - data/brutos/factckbr
      - data/brutos/factchecksbr
    outs:
      - data/processados/checagens/checagens.json
      - data/processados/checagens/amostra_teste_30.json
    metrics:
      - data/relatorios/checagens.json:
          cache: false

  treino:
    cmd: python -m checagens.bases.treino --corte 2018-09-15
    deps:
      - src/checagens/bases/treino.py
      - src/checagens/bases/texto.py
      - data/brutos/fakebr
      - data/brutos/fakewhatsappbr
      - data/brutos/faketweetbr
    outs:
      - data/processados/treino/treino.csv
      - data/processados/treino/teste.csv
      - data/processados/treino/teste_curtos.csv
    metrics:
      - data/relatorios/treino.json:
          cache: false

  indice:
    cmd: python -m inteligencia.busca --construir
    deps:
      - data/processados/checagens/checagens.json
      - src/inteligencia/busca.py
    outs:
      - data/indices/camada1

  calibrar:
    cmd: python -m inteligencia.calibracao
    deps:
      - data/indices/camada1
      - data/testes_benchmark.json
      - src/inteligencia/calibracao.py
      - src/inteligencia/busca.py
    outs:
      - experiments/results/calibracao_camada1.csv:
          cache: false
      - experiments/results/calibracao_camada1_casos.csv:
          cache: false

  treinar:
    cmd: python -m inteligencia.treino
    deps:
      - data/processados/treino/treino.csv
      - src/inteligencia/treino.py
      - src/inteligencia/classificador.py
    params:
      - semente
      - camada2
    outs:
      - models/classificador.joblib
      - experiments/results/params_camada2.json:
          cache: false
    metrics:
      - experiments/results/metricas_camada2.json:
          cache: false