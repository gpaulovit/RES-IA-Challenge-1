name: CI - Testes e Validação MLOps

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Atualizar pip e instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,azure]'

      - name: Executar suíte de testes (pytest)
        run: |
          python -m pytest -v

  deploy-azure:
    name: Build Autocontido e Deploy no Azure Container Apps
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependências de MLOps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[azure,busca]'

      - name: Autenticar na Azure
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Baixar artefatos rastreáveis (DVC + MLflow @producao)
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/baixar_artefatos_deploy.py

      - name: Construir imagem Docker autocontida
        run: |
          docker build -t res-ia-bot:latest .

      - name: Deploy no Azure Container Apps (Escala a zero)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-res-ia' }}
          AZURE_CONTAINERAPP_NAME: ${{ secrets.AZURE_CONTAINERAPP_NAME || 'aca-res-ia-bot' }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          echo "Realizando deploy no Azure Container Apps com escala a zero..."
          # az containerapp up --name "$AZURE_CONTAINERAPP_NAME" \
          #   --resource-group "$AZURE_RESOURCE_GROUP" \
          #   --source . \
          #   --env-vars APPLICATIONINSIGHTS_CONNECTION_STRING="$APPLICATIONINSIGHTS_CONNECTION_STRING" \
          #   --min-replicas 0 --max-replicas 3


