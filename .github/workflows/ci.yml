name: CI - Testes e Validação MLOps

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'ci/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Atualizar pip e instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,azure,busca]'

      - name: Executar suíte de testes (pytest)
        run: |
          python -m pytest -v

  deploy-azure:
    name: Build Autocontido e Deploy no Azure Container Apps
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Instalar dependências de MLOps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[azure,busca]'

      - name: Autenticar na Azure
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Baixar artefatos rastreáveis (DVC + MLflow @producao)
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/baixar_artefatos_deploy.py

      - name: Construir imagem Docker autocontida
        run: |
          docker build -t res-ia-bot:latest .

      - name: Deploy no Azure Container Apps
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-res-ia' }}
          AZURE_CONTAINERAPP_NAME: ${{ secrets.AZURE_CONTAINERAPP_NAME || 'aca-res-ia-bot' }}
          AZURE_CONTAINER_REGISTRY: 'crresiachallenge1'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          echo "Fazendo login no Azure Container Registry..."
          az acr login --name "$AZURE_CONTAINER_REGISTRY"

          IMAGE_TAG="${AZURE_CONTAINER_REGISTRY}.azurecr.io/res-ia-bot:latest"
          docker tag res-ia-bot:latest "$IMAGE_TAG"
          docker push "$IMAGE_TAG"

          ACR_PASSWORD=$(az acr credential show --name "$AZURE_CONTAINER_REGISTRY" --query "passwords[0].value" -o tsv)

          echo "Configurando Container App $AZURE_CONTAINERAPP_NAME..."
          if az containerapp show --name "$AZURE_CONTAINERAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" &>/dev/null; then
            echo "Habilitando ingress HTTPS para Webhook do Telegram..."
            az containerapp ingress enable \
              --name "$AZURE_CONTAINERAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --type external \
              --target-port 8080
            FQDN=$(az containerapp show --name "$AZURE_CONTAINERAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "Atualizando Container App existente (Webhook: https://$FQDN)..."
            az containerapp update \
              --name "$AZURE_CONTAINERAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$IMAGE_TAG" \
              --cpu 2.0 \
              --memory 4.0Gi \
              --set-env-vars TELEGRAM_BOT_TOKEN="$TELEGRAM_TOKEN" CAMADA2_LIGADA=0 WEBHOOK_URL="https://$FQDN" APPLICATIONINSIGHTS_CONNECTION_STRING="$APPLICATIONINSIGHTS_CONNECTION_STRING"
          else
            echo "Criando Container App..."
            az containerapp create \
              --name "$AZURE_CONTAINERAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "env-res-ia" \
              --image "$IMAGE_TAG" \
              --registry-server "${AZURE_CONTAINER_REGISTRY}.azurecr.io" \
              --registry-username "$AZURE_CONTAINER_REGISTRY" \
              --registry-password "$ACR_PASSWORD" \
              --ingress external \
              --target-port 8080 \
              --env-vars TELEGRAM_BOT_TOKEN="$TELEGRAM_TOKEN" CAMADA2_LIGADA=0 APPLICATIONINSIGHTS_CONNECTION_STRING="$APPLICATIONINSIGHTS_CONNECTION_STRING" \
              --cpu 2.0 \
              --memory 4.0Gi \
              --min-replicas 1 \
              --max-replicas 1
            FQDN=$(az containerapp show --name "$AZURE_CONTAINERAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
            az containerapp update \
              --name "$AZURE_CONTAINERAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set-env-vars WEBHOOK_URL="https://$FQDN"
          fi


